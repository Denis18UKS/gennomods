name: Build ChromaMix RGB extras 2.2.13
on:
  push:
    branches:
      - build/chromamix-rgb-2213
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract ChromaMix source
        run: cat chromamix-rgb-src-part{1..5}.b64 | base64 --decode > chromamix-2213-src.tar.xz && mkdir -p modsrc && tar -xJf chromamix-2213-src.tar.xz -C modsrc
      - name: Apply expanded white-block compatibility
        run: python chromamix-2213-fixes.py
      - name: Add RGB banner renderer integration
        run: |
          cp chromamix-2213-additions/RgbBannerMixin.java modsrc/src/main/java/dev/chromamix/extra/mixin/
          python -c "import json,pathlib;p=pathlib.Path('modsrc/src/main/resources/chromamix.extras.mixins.json');x=json.loads(p.read_text());x['client'].append('RgbBannerMixin');p.write_text(json.dumps(x,indent=2))"
      - name: Compile ChromaMix extras
        working-directory: modsrc
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload compiled classes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chromamix-extras-classes
          path: modsrc/build/libs/*.jar
