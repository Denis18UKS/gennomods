name: Build Masterki Economy + Player Utilities NeoForge 1.21.1
on:
  push:
    branches: [build/masterki-economy-playerutilities-v1]
    paths:
      - 'masterki-v1/**'
      - 'playerutilities-v1/**'
      - '.github/workflows/build-masterki-playerutilities-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [masterki-v1,playerutilities-v1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Include the approved Masterki currency icon
        if: matrix.project == 'masterki-v1'
        run: |
          mkdir -p masterki-v1/src/main/resources/assets/masterki/textures/gui
          base64 -d masterki-v1/coin.png.base64 > masterki-v1/src/main/resources/assets/masterki/textures/gui/coin.png
      - name: Compile mod with actual NeoForge
        run: gradle -p ${{ matrix.project }} clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: ${{ matrix.project }}/build/libs/*.jar

      - name: Package full project sources
        run: |
          git archive --format=zip --output=/tmp/${{ matrix.project }}-sources.zip HEAD ${{ matrix.project }} .github/workflows/build-masterki-playerutilities-v1.yml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-sources
          path: /tmp/${{ matrix.project }}-sources.zip

      - name: Publish verified Masterki JAR to dist
        if: matrix.project == 'masterki-v1'
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^version='\\([^']*\\)'/\\1/p" masterki-v1/build.gradle)
          test -n "$VERSION"
          ARTIFACT=$(find masterki-v1/build/libs -maxdepth 1 -name '*.jar' -type f | head -n 1)
          test -f "$ARTIFACT"
          mkdir -p dist
          TARGET="dist/Masterki-Economy-${VERSION}-NeoForge-1.21.1.jar"
          cp "$ARTIFACT" "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Masterki Economy ${VERSION} jar [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
