name: Build ChromaMix RGB Drops 2.2.17
on:
  push:
    branches: [build/chromamix-rgb-drops-2217]
    paths:
      - 'rgb-2213/**'
      - '.github/workflows/build-chromamix-rgb-drops-2217.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile RGB drop retention with NeoForge 21.1.250
        run: gradle -p rgb-2213 clean build --no-daemon --stacktrace
      - name: Verify compiled event subscriber
        run: |
          jar tf rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar | grep -F 'dev/chromamix/extra/RgbDropRetention.class'
      - uses: actions/upload-artifact@v4
        with:
          name: ChromaMix-2.2.17-RGB-DropFix-Compiled
          path: rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar
