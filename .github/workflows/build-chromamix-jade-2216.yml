name: Build ChromaMix Jade 2.2.16
on:
  push:
    branches: [build/chromamix-jade-2216]
    paths:
      - 'rgb-2213/**'
      - '.github/workflows/build-chromamix-jade-2216.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile Jade integration against NeoForge 21.1.250, Jade 15.10.6, Create 6.0.10
        run: gradle -p rgb-2213 build --no-daemon --stacktrace
      - name: Verify Jade plugin is in output
        run: |
          jar tf rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar | grep 'dev/chromamix/compat/ChromaJadePlugin.class'
          jar tf rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar | grep 'ChromaJadePlugin\\$ColorProvider.class'
      - uses: actions/upload-artifact@v4
        with:
          name: ChromaMix-2.2.16-Jade-Compiled
          path: rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar
