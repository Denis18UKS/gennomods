name: Build First Contact (NeoForge 1.21.1)
on:
  push:
    branches: [feature/first-contact-prototype]
    paths:
      - 'firstcontact-v0/**'
      - '.github/workflows/build-firstcontact-prototype.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install original-audio encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1
          python3 --version
      - name: Compile NeoForge and JEI (synthesize audio/assets)
        run: gradle -p firstcontact-v0 clean build --no-daemon --stacktrace
      - name: Verify JAR classfiles, radio textures and original sounds
        run: |
          set -euo pipefail
          JAR=$(find firstcontact-v0/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/FirstContact.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/RadioSignals.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/ForgottenWorkshopFeature.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/ExpeditionSites.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/RadarBlueprint.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/MarketCompatibility.class'
          jar tf "$JAR" | grep -q 'data/firstcontact/neoforge/biome_modifier/forgotten_workshop.json'
          jar tf "$JAR" | grep -q 'data/firstcontact/worldgen/configured_feature/forgotten_workshop.json'
          jar tf "$JAR" | grep -q 'data/firstcontact/recipe/radio_receiver.json'
          jar tf "$JAR" | grep -q 'assets/firstcontact/models/item/incomplete_radio_receiver.json'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/jei/RadarJeiPlugin.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/RadarIntegration.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/AeronauticsIntegration.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/jei/RadarJeiPlugin.class'
          jar tf "$JAR" | grep -q 'assets/firstcontact/textures/block/aged_brass.png'
          jar tf "$JAR" | grep -q 'assets/firstcontact/models/block/radio_receiver.json'
          jar tf "$JAR" | grep -q 'assets/firstcontact/sounds/morse_dot.ogg'
          jar tf "$JAR" | grep -q 'assets/firstcontact/sounds/morse_dash.ogg'
          jar tf "$JAR" | grep -q 'assets/firstcontact/sounds/radio_static.ogg'
          echo "VERIFIED: $JAR"
      - name: Validate the real Create Sequenced Assembly recipe in JAR
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          jars=[p for p in glob.glob("firstcontact-v0/build/libs/*.jar") if "sources" not in p]
          assert len(jars)==1, jars
          with zipfile.ZipFile(jars[0]) as jar:
              r=json.loads(jar.read("data/firstcontact/recipe/radio_receiver.json"))
              assert r["type"]=="create:sequenced_assembly", r["type"]
              assert r["transitional_item"]["id"]=="firstcontact:incomplete_radio_receiver"
              assert r["results"][0]["id"]=="firstcontact:radio_receiver"
              assert r["loops"]==1
              steps=[step["type"] for step in r["sequence"]]
              assert steps.count("create:deploying")>=5 and steps.count("create:pressing")>=2
              assert "assets/firstcontact/models/item/incomplete_radio_receiver.json" in jar.namelist()
              print("Verified actual native Create sequenced crafting with",len(steps),"operations")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firstcontact-0.5.0-jar
          path: firstcontact-v0/build/libs/*.jar
      - name: Archive source project
        run: git archive --format=zip --output=/tmp/firstcontact-sources.zip HEAD firstcontact-v0
      - uses: actions/upload-artifact@v4
        with:
          name: firstcontact-0.5.0-sources
          path: /tmp/firstcontact-sources.zip
      - name: Publish verified JAR
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR=$(find firstcontact-v0/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)
          cp "$JAR" dist/First-Contact-0.5.0-NeoForge-1.21.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/First-Contact-0.5.0-NeoForge-1.21.1.jar
          if ! git diff --cached --quiet; then
            git commit -m "Publish First Contact 0.5.0 jar [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
