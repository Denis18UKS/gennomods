name: Build First Contact prototype (NeoForge 1.21.1)
on:
  push:
    branches: [feature/first-contact-prototype]
    paths:
      - 'firstcontact-v0/**'
      - '.github/workflows/build-firstcontact-prototype.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile NeoForge + JEI integration
        run: gradle -p firstcontact-v0 clean build --no-daemon --stacktrace
      - name: Verify jar contents
        run: |
          set -euo pipefail
          JAR=$(find firstcontact-v0/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/FirstContact.class'
          jar tf "$JAR" | grep -q 'dev/zunserz/firstcontact/jei/RadarJeiPlugin.class'
          jar tf "$JAR" | grep -q 'assets/firstcontact/models/block/radio_receiver.json'
          echo "Validated $JAR"
      - uses: actions/upload-artifact@v4
        with:
          name: firstcontact-jar
          path: firstcontact-v0/build/libs/*.jar
      - name: Package sources
        run: git archive --format=zip --output=/tmp/firstcontact-sources.zip HEAD firstcontact-v0
      - uses: actions/upload-artifact@v4
        with:
          name: firstcontact-sources
          path: /tmp/firstcontact-sources.zip
      - name: Publish built JAR in dist
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR=$(find firstcontact-v0/build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*' | head -n 1)
          cp "$JAR" dist/First-Contact-0.1.0-NeoForge-1.21.1.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/First-Contact-0.1.0-NeoForge-1.21.1.jar
          if ! git diff --cached --quiet; then
            git commit -m "Publish First Contact 0.1.0 jar [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
