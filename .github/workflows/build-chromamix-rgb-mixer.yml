name: Build ChromaMix RGB Mixer
on:
  push:
    branches: [build/chromamix-rgb-2213]
    paths:
      - 'rgb-2213/**'
      - '.github/workflows/build-chromamix-rgb-mixer.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build against actual NeoForge and Create dependencies
        run: gradle -p rgb-2213 build --no-daemon --stacktrace
      - name: Verify compiled class signatures
        run: |
          jar tf rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar | grep 'RgbDynamicRecipe.class'
          jar tf rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar | grep 'RgbMixerMixin.class'
      - uses: actions/upload-artifact@v4
        with:
          name: ChromaMix-2.2.13-New-Compiled-Classes
          path: rgb-2213/build/libs/chromamix-rgb-mixer-2.2.13.jar
