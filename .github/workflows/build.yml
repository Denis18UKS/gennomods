name: TimeFracture NeoForge 1.20.1
on:
  push:
    branches: [timefracture-neoforge-1201]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build TimeFracture
        run: ./gradlew -p TimeFractureNeoForge --no-daemon clean build --stacktrace
      - name: Build TimeFractureFX
        run: ./gradlew -p TimeFractureFXNeoForge --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TimeFracture-NeoForge-1.20.1
          path: |
            TimeFractureNeoForge/build/libs/*.jar
            TimeFractureFXNeoForge/build/libs/*.jar
          if-no-files-found: error
