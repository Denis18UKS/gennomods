plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'dev.timefracture'
version = '0.4.0-alpha'
base { archivesName = 'timefracturefx-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.265'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        'timefracturefx' { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
