plugins { id 'java'; id 'net.neoforged.moddev.legacyforge' version '2.0.147' }
group='dev.timefracture'
version='0.2.0-alpha'
base { archivesName='timefracture' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
legacyForge {
    enable { neoForgeVersion='1.20.1-47.1.106' }
    runs { client { client() }; server { server() } }
    mods { timefracture { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.release=17; options.encoding='UTF-8' }
