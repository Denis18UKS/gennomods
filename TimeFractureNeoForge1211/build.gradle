plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
group = 'dev.timefracture'
version = '0.9.1-layer-dimensions'
base { archivesName = 'timefracture-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.265'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        'timefracture' { sourceSet(sourceSets.main) }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
}
dependencies {
    // JEI is optional in installed modpacks; classes are discovered only by JEI.
    compileOnly("mezz.jei:jei-1.21.1-common-api:19.57.0.451")
    compileOnly("mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451")
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
}
